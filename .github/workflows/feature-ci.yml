name: Feature CI

on:
  push:
    branches-ignore:
      - master

permissions:
  contents: read

jobs:
  # Linux build, coverage, and ASan are paused. Remove `if: false` to turn them back on.
  linux:
    name: Linux build + tests
    if: false
    uses: ./.github/workflows/feature-linux.yml

  windows:
    name: Windows build + tests
    uses: ./.github/workflows/feature-windows.yml

  coverage:
    name: Linux coverage gate
    if: false
    uses: ./.github/workflows/coverage.yml

  asan:
    name: Linux ASan + UBSan
    if: false
    uses: ./.github/workflows/asan.yml
