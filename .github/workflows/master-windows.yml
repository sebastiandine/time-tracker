name: Master Windows Build and Test

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows build + tests
    runs-on: windows-latest
    env:
      CCACHE_DIR_WIN: ${{ github.workspace }}\.ccache
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ccache
      - uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR_WIN }}
          key: ccache-windows-master-v1
          restore-keys: |
            ccache-windows-master-
            ccache-windows-
      - name: Configure MSYS2 ccache directory
        run: |
          CCACHE_DIR_POSIX="$(cygpath -u "$CCACHE_DIR_WIN")"
          echo "CCACHE_DIR=${CCACHE_DIR_POSIX}" >> "$GITHUB_ENV"
          mkdir -p "$CCACHE_DIR_POSIX"
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DTIME_TRACKER_BUILD_TESTS=ON
          -DTIME_TRACKER_BUILD_APP=OFF
          -DTIME_TRACKER_APP_VERSION="${{ inputs.version }}"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
