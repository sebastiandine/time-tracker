name: Master CI

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  compute-version:
    name: Determine semantic version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pulls = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: context.sha,
            });
            if (!pulls.data.length) {
              core.setFailed(`No PR found for commit ${context.sha}. Release flow expects merges into master through PRs.`);
              return;
            }
            const mergedPr = pulls.data.find((pr) => pr.merged_at) ?? pulls.data[0];
            core.setOutput("pr_title", mergedPr.title);
      - id: version
        run: bash scripts/compute_master_semver.sh "${{ steps.pr.outputs.pr_title }}"

  # Linux build, coverage, and ASan are paused. Remove `if: false` and add
  # linux, coverage, and asan back to tag-master.needs to turn them back on.
  linux:
    name: Linux build + tests
    if: false
    needs: compute-version
    uses: ./.github/workflows/master-linux.yml
    with:
      version: ${{ needs.compute-version.outputs.version }}

  windows:
    name: Windows build + tests
    needs: compute-version
    uses: ./.github/workflows/master-windows.yml
    with:
      version: ${{ needs.compute-version.outputs.version }}
      merge_commit_sha: ${{ github.sha }}

  coverage:
    name: Linux coverage gate
    if: false
    needs: compute-version
    uses: ./.github/workflows/coverage.yml

  asan:
    name: Linux ASan + UBSan
    if: false
    needs: compute-version
    uses: ./.github/workflows/asan.yml

  tag-master:
    name: Tag master
    needs: [compute-version, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: time-tracker-windows-${{ needs.compute-version.outputs.version }}.zip
          path: release/windows

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: time-tracker-windows-installer-${{ needs.compute-version.outputs.version }}
          path: release/installer

      - name: Package release assets
        run: |
          mkdir -p release-assets
          VERSION="${{ needs.compute-version.outputs.version }}"
          (
            cd release/windows
            zip -r "../../release-assets/time-tracker-windows-${VERSION}.zip" .
          )
          cp release/installer/time-tracker-windows-installer.exe "release-assets/time-tracker-windows-installer-${VERSION}.exe"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.compute-version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-assets/*
