name: Linux ASan and UBSan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  asan:
    name: Linux ASan + UBSan
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build cmake
      - name: Configure
        run: >
          cmake -S . -B build-asan -G Ninja
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug
          -DTIME_TRACKER_BUILD_TESTS=ON
          -DTIME_TRACKER_BUILD_APP=OFF
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build and test
        run: >
          cmake --build build-asan --target time_tracker_core_tests --parallel &&
          ctest --test-dir build-asan --output-on-failure
