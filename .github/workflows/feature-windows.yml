name: Feature Windows Build, Test, and Package

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows build + tests
    runs-on: windows-latest
    env:
      CCACHE_DIR_WIN: ${{ github.workspace }}\.ccache
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-nsis
      - name: Compute feature version
        run: |
          VERSION="$(bash scripts/compute_feature_version.sh "${GITHUB_REF_NAME}" "${GITHUB_SHA}")"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR_WIN }}
          key: ccache-windows-${{ github.ref_name }}-v2
          restore-keys: |
            ccache-windows-${{ github.ref_name }}-
            ccache-windows-
      - name: Configure MSYS2 ccache directory
        run: |
          CCACHE_DIR_POSIX="$(cygpath -u "$CCACHE_DIR_WIN")"
          echo "CCACHE_DIR=${CCACHE_DIR_POSIX}" >> "$GITHUB_ENV"
          mkdir -p "$CCACHE_DIR_POSIX"
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DTIME_TRACKER_BUILD_TESTS=ON
          -DTIME_TRACKER_BUILD_APP=ON
          -DTIME_TRACKER_APP_VERSION="${VERSION}"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - name: Remove test executable from bundle
        run: rm -f build/bin/time_tracker_core_tests.exe build/bin/time_tracker_core_tests
      - name: Collect runtime DLL dependencies
        run: bash scripts/collect_windows_runtime.sh
      - name: Verify runtime dependencies are resolved
        run: bash scripts/verify_windows_runtime.sh
      - name: Build Windows installer
        run: makensis -DAPP_VERSION="${VERSION}" scripts/installer.nsi
      - name: Stage Windows artifact folder
        run: |
          rm -rf dist/time-tracker-windows
          mkdir -p dist/time-tracker-windows
          cp -a build/bin/. dist/time-tracker-windows/
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: time-tracker-windows-${{ env.VERSION }}.zip
          path: dist/time-tracker-windows
          if-no-files-found: error
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: time-tracker-windows-installer-${{ env.VERSION }}
          path: time-tracker-windows-installer.exe
          if-no-files-found: error
